id: kosmos_discontinuity_probe
label: Discontinuity Probe
category: '[KosmOS]'

# Skeleton block: passes samples through unchanged and detects nothing yet.
# See ../python/kosmos/discontinuity_probe.py for the design notes.
#
# The import is a top-level `kosmos` package because install.sh installs it that
# way. A module generated by gr_modtool on GNU Radio 3.10 would live under the
# gnuradio namespace instead, and this line has to change with it.

templates:
  imports: from kosmos import discontinuity_probe
  make: discontinuity_probe.discontinuity_probe(${sample_rate}, ${log_path}, ${tolerance_samples})

parameters:
- id: sample_rate
  label: Sample Rate
  dtype: float
  default: samp_rate

- id: log_path
  label: Log Path
  dtype: string
  default: '/var/log/kosmos/discontinuity.jsonl'

- id: tolerance_samples
  label: Tolerance (samples)
  dtype: int
  default: '2'

inputs:
- label: in
  domain: stream
  dtype: complex

outputs:
- label: out
  domain: stream
  dtype: complex

documentation: |-
  Logs every discontinuity in the sample stream, with a timestamp and a size,
  and passes samples through unchanged.

  Detection reads the rx_time stream tags a hardware source emits on overflow;
  it cannot be done by inspecting the sample buffer, which is always contiguous
  regardless of what the radio dropped.

  Sample Rate must match the source. If it does not, gap sizes are wrong by the
  ratio between the two, in a way nothing else will flag.

  STATUS: skeleton. No detection logic yet.

file_format: 1
